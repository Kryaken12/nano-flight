plugins {
    id 'fabric-loom' version '1.5-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = "https://maven.ladysnake.org/releases" }   // Player Ability Lib
    maven { url = "https://maven.modmuss50.me/" }            // Tech Reborn / Reborn Core
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Player Ability Lib: bundled inside our jar (jar-in-jar)
    modImplementation "io.github.ladysnake:PlayerAbilityLib:${project.pal_version}"
    include "io.github.ladysnake:PlayerAbilityLib:${project.pal_version}"

    // Tech Reborn + Reborn Core (compile only, the player installs them)
    // ЕСЛИ maven не находит эти координаты - см. запасной вариант в README.txt
    modCompileOnly "TechReborn:TechReborn-1.20:${project.techreborn_version}"
    modCompileOnly "RebornCore:RebornCore-1.20:${project.techreborn_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 17 }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}
